[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --alluredir=artifacts/allure-results --clean-alluredir --junitxml=artifacts/junit/junit.xml
markers =
    framework: kiểm tra bản thân framework, không mở browser
    functional: kiểm thử chức năng website, chạy browser
    failure_demo: demo cố ý fail để quan sát bằng chứng